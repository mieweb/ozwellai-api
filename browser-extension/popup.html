<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ozwell</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">O</span>
        <div><h1>Ozwell</h1><p>Your assistant, a click away.</p></div>
      </header>

      <section class="page-card" aria-labelledby="page-heading">
        <h2 id="page-heading">This page</h2>
        <p id="current-site" class="site">Checking this page…</p>
        <button id="toggle-tab" type="button" disabled>Show Ozwell on this page</button>
      </section>

      <form id="settings-form">
        <label for="mode">When should Ozwell appear?</label>
        <select id="mode" name="mode" aria-describedby="mode-description" disabled>
          <option value="off">Off</option>
          <option value="manual" selected>On demand</option>
          <option value="allowlist">Whitelisted domains</option>
          <option value="always">Always on</option>
        </select>
        <p id="mode-description" class="help">Show Ozwell when you choose it for a page.</p>

        <div id="domains-field" hidden>
          <div class="field-heading">
            <label for="domains">Allowed domains</label>
            <button id="add-current-site" class="text-button" type="button" disabled>Add current site</button>
          </div>
          <textarea id="domains" name="domains" rows="4" placeholder="example.com&#10;app.example.com" spellcheck="false" autocapitalize="none" aria-describedby="domains-help"></textarea>
          <p id="domains-help" class="help">One exact domain per line. Add subdomains separately.</p>
        </div>

        <button id="save" class="primary" type="submit" disabled>Save settings</button>
      </form>

      <p id="status" class="feedback" role="status" aria-live="polite"></p>
      <p id="error" class="feedback error" role="alert" hidden></p>
      <footer>Ozwell starts as a small launcher. Chat and sign-in are hosted by <a href="https://ozwell.ai" target="_blank" rel="noopener noreferrer">Ozwell.ai</a>.</footer>
    </main>
  </body>
</html>
