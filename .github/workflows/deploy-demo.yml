name: Deploy Demo Site

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'landing-page/**'
      - '.github/workflows/deploy-demo.yml'
      - 'reference-server/embed/**'
      - 'scripts/build-demo-package.sh'

concurrency:
  group: deploy-demo-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Demo Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: ./scripts/build-demo-package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-page-build
          path: landing-page-build.tar.gz
          retention-days: 1

  deploy-prod:
    name: Deploy to ozwell-phxdc-node1 landing
    needs: build
    if: github.ref_name == 'main'
    runs-on: [self-hosted, ozwell-phxdc-node1]

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-page-build

      - name: Prepare SSH host
        env:
          DEPLOY_HOST: ${{ vars.OZWELL_REFSERVER_DEPLOY_HOST || 'ozwell-phxdc-node1' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts

      - name: Upload to server
        env:
          DEPLOY_HOST: ${{ vars.OZWELL_REFSERVER_DEPLOY_HOST || 'ozwell-phxdc-node1' }}
        run: rsync -ruva --progress landing-page-build.tar.gz "$DEPLOY_HOST:/tmp/"

      - name: Extract and restart service
        env:
          DEPLOY_HOST: ${{ vars.OZWELL_REFSERVER_DEPLOY_HOST || 'ozwell-phxdc-node1' }}
          DEPLOY_PATH: ${{ vars.OZWELL_LANDING_DEPLOY_PATH || '/storage/apps/ozwellai-api' }}
          RESTART_COMMAND: ${{ vars.OZWELL_LANDING_RESTART_COMMAND || 'sudo systemctl restart ozwellai-landing' }}
        run: |
          set -euo pipefail
          ssh "$DEPLOY_HOST" "DEPLOY_PATH=$(printf '%q' "$DEPLOY_PATH") RESTART_COMMAND=$(printf '%q' "$RESTART_COMMAND") bash -s" <<'REMOTE'
            set -euo pipefail

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Prepare the release in staging so a failed extract/install leaves the live demo untouched.
            rm -rf .landing-staging
            mkdir .landing-staging
            tar -xzf /tmp/landing-page-build.tar.gz -C .landing-staging
            (cd .landing-staging/landing-page && npm ci --omit=dev)

            rm -rf landing-page.prev
            if [[ -d landing-page ]]; then mv landing-page landing-page.prev; fi
            mv .landing-staging/landing-page landing-page
            rm -rf .landing-staging

            eval "$RESTART_COMMAND"
            rm /tmp/landing-page-build.tar.gz
          REMOTE

  deploy-dev:
    name: Deploy to ozwell-dev2 landing
    needs: build
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: landing-page-build

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OZWELL_DEV2_SSH_PRIVATE_KEY }}
          DEPLOY_HOSTNAME: ${{ vars.OZWELL_DEV2_HOST || 'ozwell-dev2.os.mieweb.org' }}
          DEPLOY_PORT: ${{ vars.OZWELL_DEV2_PORT || '2029' }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "OZWELL_DEV2_SSH_PRIVATE_KEY secret is required"
            exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOSTNAME" >> ~/.ssh/known_hosts

      - name: Upload to dev2
        env:
          DEPLOY_HOSTNAME: ${{ vars.OZWELL_DEV2_HOST || 'ozwell-dev2.os.mieweb.org' }}
          DEPLOY_PORT: ${{ vars.OZWELL_DEV2_PORT || '2029' }}
          DEPLOY_USER: ${{ vars.OZWELL_DEV2_USER || 'rgara' }}
        run: rsync -e "ssh -p $DEPLOY_PORT" -av --progress landing-page-build.tar.gz "$DEPLOY_USER@$DEPLOY_HOSTNAME:/tmp/"

      - name: Extract and restart dev2 landing
        env:
          DEPLOY_HOSTNAME: ${{ vars.OZWELL_DEV2_HOST || 'ozwell-dev2.os.mieweb.org' }}
          DEPLOY_PORT: ${{ vars.OZWELL_DEV2_PORT || '2029' }}
          DEPLOY_USER: ${{ vars.OZWELL_DEV2_USER || 'rgara' }}
          DEPLOY_PATH: ${{ vars.OZWELL_DEV2_DEPLOY_PATH || '/home/rgara/ozwellai-api' }}
          DEV_MANAGER_URL: ${{ vars.OZWELL_DEV2_MANAGER_URL || 'https://ozwellconsole.os.mieweb.org' }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOSTNAME" "DEPLOY_PATH='$DEPLOY_PATH' DEV_MANAGER_URL='$DEV_MANAGER_URL' bash -s" <<'REMOTE'
            set -euo pipefail

            deploy_path="${DEPLOY_PATH:-/home/rgara/ozwellai-api}"
            dev_manager_url="${DEV_MANAGER_URL:-https://ozwellconsole.os.mieweb.org}"
            cd "$deploy_path"

            tar -xzf /tmp/landing-page-build.tar.gz

            cd landing-page
            npm ci --omit=dev

            touch .env
            if grep -q '^MANAGER_URL=' .env; then
              sed -i "s|^MANAGER_URL=.*|MANAGER_URL=${dev_manager_url}|" .env
            else
              printf '\nMANAGER_URL=%s\n' "$dev_manager_url" >> .env
            fi

            pm2 stop landing || true
            pm2 delete landing || true
            pm2 start server.js --name landing
            pm2 save

            rm /tmp/landing-page-build.tar.gz
          REMOTE
